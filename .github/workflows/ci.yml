name: Continuous Integration & Packaging Linter

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-config:
    name: Config Drift Validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Validate Configuration & Documentation Drift
        run: |
          python scripts/validate_config.py

  run-tests:
    name: Test Suite (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m unittest tests.test_windows_compatibility tests.test_cdg -v

  lint-aur-packaging:
    name: AUR Packaging & .SRCINFO Linter
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize Arch environment and dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm --needed base-devel git

      - name: Lint .SRCINFO vs PKGBUILD
        run: |
          useradd -m -d /home/builder builder
          chown -R builder:builder .
          su builder -c "
            set -e
            cd packaging/aur
            makepkg --printsrcinfo > /tmp/.SRCINFO.generated
            if ! diff -u .SRCINFO /tmp/.SRCINFO.generated; then
              echo '::error::packaging/aur/.SRCINFO is out of sync with packaging/aur/PKGBUILD!'
              echo '::notice::Run \`makepkg --printsrcinfo > packaging/aur/.SRCINFO\` locally and commit the result.'
              exit 1
            fi
            echo '✅ packaging/aur/.SRCINFO is perfectly synchronized with PKGBUILD.'
          "
