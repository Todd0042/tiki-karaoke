services:
  tiki-karaoke:
    build: .
    container_name: tiki-karaoke
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./karaoke_library:/app/karaoke_library
      - ./config.json:/app/config.json
    environment:
      - PORT=8000
      - HOST=0.0.0.0
