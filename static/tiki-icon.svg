<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1335"/>
      <stop offset="100%" stop-color="#0a0515"/>
    </radialGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#ff00aa"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00a8ff"/>
    </linearGradient>
    <linearGradient id="neonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" stroke="url(#neonPink)" stroke-width="8" />

  <!-- Tropical Palm Leaves in Background -->
  <path d="M 256,120 C 290,60 360,50 400,80 C 370,110 330,140 280,160 Z" fill="url(#neonCyan)" opacity="0.6" filter="url(#glow)"/>
  <path d="M 256,120 C 220,60 150,50 110,80 C 140,110 180,140 230,160 Z" fill="url(#neonCyan)" opacity="0.6" filter="url(#glow)"/>
  <path d="M 256,120 C 310,100 370,130 390,190 C 340,180 290,170 265,165 Z" fill="url(#neonCyan)" opacity="0.4"/>
  <path d="M 256,120 C 200,100 140,130 120,190 C 170,180 220,170 245,165 Z" fill="url(#neonCyan)" opacity="0.4"/>

  <!-- Vintage Karaoke Microphone -->
  <!-- Stand & Base -->
  <path d="M 244,340 L 268,340 L 262,420 L 250,420 Z" fill="url(#neonPink)" />
  <ellipse cx="256" cy="425" rx="55" ry="12" fill="url(#neonPink)" filter="url(#glow)" />

  <!-- Mic Head / Grille Capsule -->
  <rect x="220" y="160" width="72" height="110" rx="36" fill="#150a24" stroke="url(#neonCyan)" stroke-width="6" filter="url(#glow)"/>
  
  <!-- Grille Mesh Lines -->
  <line x1="222" y1="185" x2="290" y2="185" stroke="url(#neonCyan)" stroke-width="3" />
  <line x1="220" y1="210" x2="292" y2="210" stroke="url(#neonCyan)" stroke-width="4" />
  <line x1="220" y1="235" x2="292" y2="235" stroke="url(#neonCyan)" stroke-width="4" />
  <line x1="222" y1="255" x2="290" y2="255" stroke="url(#neonCyan)" stroke-width="3" />
  <line x1="256" y1="162" x2="256" y2="268" stroke="url(#neonCyan)" stroke-width="3" />

  <!-- Mic Neck Mount -->
  <rect x="238" y="270" width="36" height="30" rx="6" fill="url(#neonGold)" />
  <!-- Swivel Joint -->
  <circle cx="256" cy="318" r="14" fill="url(#neonGold)" filter="url(#glow)" />

  <!-- Neon Music Notes -->
  <g fill="url(#neonGold)" filter="url(#glow)">
    <!-- Note 1 -->
    <path d="M 125,290 C 125,275 135,265 150,265 C 165,265 175,275 175,290 C 175,305 160,315 145,315 C 130,315 125,305 125,290 Z" />
    <rect x="165" y="220" width="8" height="70" />
    <polygon points="165,220 195,205 195,225 165,240" />

    <!-- Note 2 -->
    <path d="M 345,260 C 345,245 355,235 370,235 C 385,235 395,245 395,260 C 395,275 380,285 365,285 C 350,285 345,275 345,260 Z" />
    <rect x="385" y="190" width="8" height="70" />
    <polygon points="385,190 415,175 415,195 385,210" />
  </g>

  <!-- Tiki Neon Star Accents -->
  <polygon points="256,55 262,72 278,75 265,86 268,102 256,92 244,102 247,86 234,75 250,72" fill="url(#neonGold)" filter="url(#glow)" />
</svg>
